<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klassenkasse 3c - Schuljahr 2026/27</title>   
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="manifest" href="manifest.json?v=3">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js?v=3"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary: #4a90e2;
            --success: #2ec4b6;
            --danger: #e71d36;
            --warning: #ffb703;
            --border: #dddddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            font-size: 16px;
            padding-bottom: 60px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        header h1 {
            font-size: 1.4rem;
            color: #1e293b;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.9rem;
            color: #64748b;
        }

        /* Dashboard-Karten */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        @media(min-width: 600px) {
            .dashboard { grid-template-columns: repeat(3, 1fr); }
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
        }

        .card.balance { border-left-color: var(--primary); }
        .card.income { border-left-color: var(--success); }
        .card.expense { border-left-color: var(--danger); }

        .card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 5px;
        }

        .card .amount {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }

        /* Formular */
        .form-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            transition: border 0.3s;
        }

        .form-container.edit-mode {
            border: 2px solid var(--warning);
        }

        .form-container h2, .backup-container h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #1e293b;
        }

        .edit-indicator {
            display: none;
            background: #fff3cd;
            color: #856404;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #64748b;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: #f8fafc;
            -webkit-appearance: none;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: #212529;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
            margin-top: 8px;
        }

        .btn-success {
            background: var(--success);
            color: white;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        .btn-excel {
            background: #107c41;
            color: white;
        }

        .btn-pdf {
            background: #e71d36;
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            padding: 6px 10px;
            font-size: 0.9rem;
            width: auto;
            border-radius: 6px;
        }

        .btn-edit {
            background: #fef3c7;
            color: #d97706;
        }

        .btn-delete {
            background: #ffe3e3;
            color: var(--danger);
        }

        /* Buchungsliste */
        .transactions-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .transaction-list {
            list-style: none;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .tx-info {
            flex: 1;
            padding-right: 10px;
        }

        .tx-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1e293b;
            margin-bottom: 2px;
        }

        .tx-meta {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .tx-amount {
            font-weight: bold;
            font-size: 1.05rem;
            white-space: nowrap;
            text-align: right;
            margin-right: 12px;
        }

        .tx-details {
            font-size: 0.75rem;
            color: #64748b;
            display: block;
        }

        /* Backup Bereich */
        .backup-container {
            background: #eef2f6;
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            margin-bottom: 20px;
        }

        .backup-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        @media(min-width: 600px) {
            .backup-grid { grid-template-columns: 1fr 1fr; }
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn-outline {
            background: white;
            border: 1px solid #cbd5e1;
            color: #475569;
            text-align: center;
        }

        /* PRINT OPTIMIERUNG FÜR DEN PDF-EXPORT */
        @media print {
            @page {
                size: A4 portrait;
                margin: 15mm;
            }
            
            body {
                background: white !important;
                color: #000000 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            header {
                box-shadow: none !important;
                border-bottom: 2px solid #333 !important;
                border-radius: 0 !important;
                padding-bottom: 10px !important;
                margin-bottom: 25px !important;
            }

            .dashboard {
                display: flex !important;
                flex-direction: row !important;
                justify-content: space-between !important;
                gap: 15px !important;
                margin-bottom: 30px !important;
            }

            .card {
                flex: 1 !important;
                float: none !important;
                width: auto !important;
                background: #f8fafc !important;
                border: 1px solid #cbd5e1 !important;
                border-left: 6px solid var(--primary) !important;
                border-radius: 8px !important;
                box-shadow: none !important;
                padding: 12px !important;
            }
            
            .card.balance { border-left-color: var(--primary) !important; }
            .card.income { border-left-color: var(--success) !important; }
            .card.expense { border-left-color: var(--danger) !important; }

            .card h3 {
                font-size: 0.8rem !important;
                color: #475569 !important;
            }

            .card .amount {
                font-size: 1.4rem !important;
            }

            .form-container, .backup-container, .action-buttons, .btn-success, .tx-meta + .tx-details::before {
                display: none !important;
            }

            .transactions-container {
                box-shadow: none !important;
                padding: 0 !important;
            }

            .transactions-container h2 {
                font-size: 1.2rem !important;
                border-bottom: 1px solid #64748b !important;
                padding-bottom: 5px !important;
                margin-bottom: 15px !important;
            }

            .transaction-item {
                border-bottom: 1px solid #cbd5e1 !important;
                padding: 8px 0 !important;
                page-break-inside: avoid;
            }

            .tx-title {
                font-size: 0.95rem !important;
            }

            .tx-amount {
                margin-right: 0 !important;
                font-size: 1rem !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Klassenkasse 2c</h1>
        <p>Schuljahr 2025/2026 – Mobile Verwaltung</p>
    </header>

    <div class="dashboard">
        <div class="card balance">
            <h3>Aktueller Bestand</h3>
            <div class="amount" id="total-balance">0,00 €</div>
        </div>
        <div class="card income">
            <h3>Gesamteinnahmen</h3>
            <div class="amount text-success" id="total-income">0,00 €</div>
        </div>
        <div class="card expense">
            <h3>Gesamtausgaben</h3>
            <div class="amount text-danger" id="total-expense">0,00 €</div>
        </div>
    </div>

    <div class="form-container" id="form-container">
        <h2 id="form-title">Neue Buchung hinzufügen</h2>
        <div class="edit-indicator" id="edit-indicator">⚠️ Du bearbeitest gerade einen Eintrag!</div>
        <form id="tx-form">
            <div class="form-group">
                <label for="type">Buchungsart</label>
                <select id="type">
                    <option value="expense">Ausgabe (Geld geht weg)</option>
                    <option value="income">Einnahme (Geld kommt rein)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="description">Beschreibung / Verwendungszweck</label>
                <input type="text" id="description" placeholder="z.B. Kopiergeld, Ausflug Zoo" required>
            </div>
            <div class="form-group">
                <label for="date">Datum</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="quantity">Anzahl</label>
                    <input type="number" id="quantity" value="1" min="1">
                </div>
                <div class="form-group">
                    <label for="price">Einzelpreis in € (ohne Vorzeichen)</label>
                    <input type="number" id="price" step="0.01" placeholder="z.B. 5.50" min="0.01" required>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">Buchung hinzufügen</button>
            <button type="button" class="btn-secondary" id="cancel-btn" style="display: none;" onclick="cancelEdit()">Bearbeiten abbrechen</button>
        </form>
    </div>

    <div class="transactions-container">
        <h2>Buchungshistorie (Neueste oben)</h2>
        <ul class="transaction-list" id="transaction-list">
            </ul>
    </div>

    <div class="backup-container">
        <h2>Backup & Datensicherung</h2>
        <div class="backup-grid">
            <button class="btn-outline" onclick="exportDataJSON()">1. Daten-Backup herunterladen (.json)</button>
            <div class="file-input-wrapper">
                <button class="btn-outline">2. Backup wiederherstellen</button>
                <input type="file" id="import-file" accept=".json" onchange="importDataJSON(event)">
            </div>
            <button class="btn-excel" onclick="exportDataExcel()">3. Als Excel (.xlsx) exportieren</button>
            <button class="btn-pdf" onclick="exportDataPDF()">4. Als PDF exportieren / Drucken</button>
        </div>
        <button class="btn-success" onclick="exportDataHTML()">Ganze App speichern (HTML herunterladen)</button>
    </div>

    <script>
        // Deine Originaldaten (dienen nur noch als Fallback, falls im Speicher gar nichts liegt)
        const defaultTransactions = [
            { id: "1", description: "Einkauf Penny", date: "2025-12-10", quantity: 1, price: -7.93, sum: -7.93 },
            { id: "2", description: "Schoko Riegel Rewe für Adventskalener", date: "2025-11-29", quantity: 1, price: -3.87, sum: -3.87 },
            { id: "3", description: "Keksaustecher Woolworth", date: "2025-11-24", quantity: 1, price: -4.50, sum: -4.50 },
            { id: "4", description: "Elterngeld laut Elternabend 22*7,3", date: "2025-09-25", quantity: 22, price: 7.30, sum: 160.60 },
            { id: "5", description: "Müller Injet Papier", date: "2025-08-29", quantity: 1, price: -4.99, sum: -4.99 },
            { id: "6", description: "Zwergenträume", date: "2025-08-27", quantity: 1, price: -46.54, sum: -46.54 },
            { id: "7", description: "Pfeiffenreiniger", date: "2025-09-10", quantity: 1, price: -2.97, sum: -2.97 },
            { id: "8", description: "Mein Lesepass", date: "2025-09-12", quantity: 1, price: -25.90, sum: -25.90 },
            { id: "9", description: "Kindermuseum München", date: "2025-10-16", quantity: 1, price: -90.00, sum: -90.00 },
            { id: "10", description: "Herma Etiketten", date: "2025-02-21", quantity: 1, price: -11.99, sum: -11.99 },
            { id: "11", description: "Rossmann (Verbrauchsmaterial: Kosmetiktücher / Spülmittel etc.)", date: "2025-07-18", quantity: null, price: null, sum: -12.44 },
            { id: "12", description: "Wackelaugen selbstklebend", date: "2025-03-23", quantity: null, price: null, sum: -6.99 },
            { id: "13", description: "Papiertüten Osterhasen / Rossmann", date: "2025-03-15", quantity: null, price: null, sum: -5.56 },
            { id: "14", description: "Holzperlen bunt zum Auffädeln", date: "2025-02-12", quantity: null, price: null, sum: -6.99 },
            { id: "15", description: "Aufstockung der Klassenkasse", date: "2025-02-05", quantity: 23, price: 5.00, sum: 115.00 },
            { id: "16", description: "Adventskalender Pixie Bücher (Sammelbestellung)", date: "2024-12-15", quantity: 22, price: -0.99, sum: -21.78 },
            { id: "17", description: "Ausflug Marionettentheater (Betreuerkarten)", date: "", quantity: 2, price: -8.00, sum: -16.00 },
            { id: "18", description: "Ausflug Marionettentheater", date: "", quantity: 22, price: -1.00, sum: -22.00 },
            { id: "19", description: "Musikalische Aufführung \"Siebenschläfer\"", date: "", quantity: null, price: null, sum: -48.70 },
            { id: "20", description: "Geburtstagsgeschenk Edelsteine", date: "2023-07-17", quantity: null, price: null, sum: -9.32 },
            { id: "21", description: "Wilkommensgeschenk Stifte", date: "2024-09-01", quantity: null, price: null, sum: -9.99 },
            { id: "22", description: "CD Leerhüllen", date: "2024-09-04", quantity: 22, price: -0.19, sum: -4.18 },
            { id: "23", description: "Startguthaben", date: "2024-09-22", quantity: 22, price: 4.45, sum: 97.90 }
        ];

        let transactions = [];
        let editId = null;
        let globalIncome = 0;
        let globalExpense = 0;
        let globalBalance = 0;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            loadFromLocalStorage();
        });

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('klassenkasse_persistent_v6');
            if (saved) {
                try {
                    transactions = JSON.parse(saved);
                } catch(e) {
                    transactions = [...defaultTransactions];
                }
            } else {
                transactions = [...defaultTransactions];
            }
            updateUI();
        }

        function saveToLocalStorage() {
            localStorage.setItem('klassenkasse_persistent_v6', JSON.stringify(transactions));
            updateUI();
        }

        function getTimestampString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${year}${month}${day}_${hours}${minutes}`;
        }

        function formatEuro(amount) {
            return amount.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
        }

        function formatDate(dateStr) {
            if (!dateStr) return "Kein Datum";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('de-DE');
        }

        function updateUI() {
            const listEl = document.getElementById('transaction-list');
            listEl.innerHTML = '';

            globalIncome = 0;
            globalExpense = 0;

            transactions.sort((a, b) => new Date(b.date || '1970-01-01') - new Date(a.date || '1970-01-01'));

            transactions.forEach((tx) => {
                if (tx.sum > 0) {
                    globalIncome += tx.sum;
                } else {
                    globalExpense += Math.abs(tx.sum);
                }

                const li = document.createElement('li');
                li.className = 'transaction-item';

                let detailsText = '';
                if(tx.quantity && tx.price) {
                    detailsText = `<span class="tx-details">${tx.quantity} x ${formatEuro(Math.abs(tx.price))}</span>`;
                }

                li.innerHTML = `
                    <div class="tx-info">
                        <div class="tx-title">${tx.description}</div>
                        <div class="tx-meta">${formatDate(tx.date)}</div>
                        ${detailsText}
                    </div>
                    <div class="tx-amount ${tx.sum >= 0 ? 'text-success' : 'text-danger'}">
                        ${tx.sum >= 0 ? '+' : ''}${formatEuro(tx.sum)}
                    </div>
                    <div class="action-buttons">
                        <button class="btn-action btn-edit" onclick="startEdit('${tx.id}')" title="Bearbeiten">✏️</button>
                        <button class="btn-action btn-delete" onclick="deleteTransaction('${tx.id}')" title="Löschen">🗑️</button>
                    </div>
                `;
                listEl.appendChild(li);
            });

            globalBalance = Math.round((globalIncome - globalExpense) * 100) / 100;

            document.getElementById('total-balance').innerText = formatEuro(globalBalance);
            document.getElementById('total-balance').className = 'amount ' + (globalBalance >= 0 ? 'text-success' : 'text-danger');
            document.getElementById('total-income').innerText = formatEuro(globalIncome);
            document.getElementById('total-expense').innerText = formatEuro(globalExpense);
        }

        function startEdit(id) {
            const tx = transactions.find(t => t.id === id);
            if (!tx) return;
            editId = id;
            document.getElementById('form-container').className = 'form-container edit-mode';
            document.getElementById('form-title').innerText = 'Buchung korrigieren';
            document.getElementById('edit-indicator').style.display = 'block';
            document.getElementById('submit-btn').innerText = 'Änderungen speichern';
            document.getElementById('submit-btn').className = 'btn-warning';
            document.getElementById('cancel-btn').style.display = 'block';
            document.getElementById('type').value = tx.sum >= 0 ? 'income' : 'expense';
            document.getElementById('description').value = tx.description;
            document.getElementById('date').value = tx.date || '';
            document.getElementById('quantity').value = tx.quantity || 1;
            document.getElementById('price').value = tx.price ? Math.abs(tx.price) : Math.abs(tx.sum);
            document.getElementById('form-container').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            editId = null;
            document.getElementById('form-container').className = 'form-container';
            document.getElementById('form-title').innerText = 'Neue Buchung hinzufügen';
            document.getElementById('edit-indicator').style.display = 'none';
            document.getElementById('submit-btn').innerText = 'Buchung hinzufügen';
            document.getElementById('submit-btn').className = 'btn-primary';
            document.getElementById('cancel-btn').style.display = 'none';
            document.getElementById('description').value = '';
            document.getElementById('quantity').value = '1';
            document.getElementById('price').value = '';
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
        }

        function deleteTransaction(id) {
            const tx = transactions.find(t => t.id === id);
            if (confirm(`Möchtest du den Eintrag "${tx.description}" wirklich löschen?`)) {
                transactions = transactions.filter(t => t.id !== id);
                if (editId === id) cancelEdit();
                updateUI();
                saveToLocalStorage();
            }
        }

        document.getElementById('tx-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const type = document.getElementById('type').value;
            const description = document.getElementById('description').value;
            const date = document.getElementById('date').value;
            const quantity = parseInt(document.getElementById('quantity').value) || 1;
            let price = parseFloat(document.getElementById('price').value);
            
            if (type === 'expense') price = -Math.abs(price);
            else price = Math.abs(price);

            const sum = Math.round((quantity * price) * 100) / 100;

            if (editId !== null) {
                const index = transactions.findIndex(t => t.id === editId);
                if (index !== -1) {
                    transactions[index].description = description;
                    transactions[index].date = date;
                    transactions[index].quantity = quantity;
                    transactions[index].price = price;
                    transactions[index].sum = sum;
                }
                cancelEdit();
            } else {
                transactions.unshift({
                    id: Date.now().toString(),
                    description: description,
                    date: date,
                    quantity: quantity,
                    price: price,
                    sum: sum
                });
                document.getElementById('description').value = '';
                document.getElementById('quantity').value = '1';
                document.getElementById('price').value = '';
            }
            saveToLocalStorage();
        });

        function exportDataHTML() {
            let currentHTML = document.documentElement.outerHTML;
            const regex = /const defaultTransactions = \[\s*[\s\S]*?\s*\];/;
            const newTransactionsCode = `const defaultTransactions = ${JSON.stringify(transactions, null, 4)};`;
            currentHTML = currentHTML.replace(regex, newTransactionsCode);
            
            const blob = new Blob(["<!DOCTYPE html>\n" + currentHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.download = `Klassenkasse_2c_App_Stand_${getTimestampString()}.html`;
            a.href = URL.createObjectURL(blob);
            a.click();
        }

        function exportDataJSON() {
            const dataStr = JSON.stringify(transactions, null, 4);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const a = document.createElement('a');
            a.download = `Klassenkasse_2c_DatenBackup_${getTimestampString()}.json`;
            a.href = URL.createObjectURL(blob);
            a.click();
        }

        function importDataJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        transactions = importedData;
                        transactions.forEach((t, i) => { if(!t.id) t.id = "imp_" + i + "_" + Date.now() });
                        cancelEdit();
                        saveToLocalStorage();
                        alert('Backup erfolgreich wiederhergestellt und dauerhaft gespeichert!');
                        event.target.value = '';
                    }
                } catch (err) { alert('Fehler beim Lesen.'); }
            };
            reader.readAsText(file);
        }

        function exportDataExcel() {
            if (typeof XLSX === 'undefined') {
                alert("Bibliothek lädt noch...");
                return;
            }

            let wsData = [
                ["Klassenkasse 2c - Schuljahr 2025/2026"], 
                [], 
                ["ÜBERSICHT KASSENSTAND"], 
                ["Aktueller Saldo:", globalBalance],
                ["Gesamteinnahmen:", globalIncome],
                ["Gesamtausgaben:", globalExpense],
                [], 
                ["BUCHUNGSLISTE"], 
                ["Beschreibung", "Datum", "Anzahl", "Einzelpreis (€)", "Summe (€)"] 
            ];

            transactions.forEach(tx => {
                wsData.push([
                    tx.description,
                    tx.date ? formatDate(tx.date) : "Kein Datum",
                    tx.quantity || "",
                    tx.price ? Math.abs(tx.price) : "",
                    tx.sum
                ]);
            });

            const worksheet = XLSX.utils.aoa_to_sheet(wsData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Übersicht");

            worksheet['!cols'] = [{ wch: 35 }, { wch: 15 }, { wch: 10 }, { wch: 15 }, { wch: 15 }];

            XLSX.writeFile(workbook, `Klassenkasse_2c_Export_${getTimestampString().split('_')[0]}.xlsx`);
        }

        function exportDataPDF() {
            window.print(); 
        }
    </script>
</body>
